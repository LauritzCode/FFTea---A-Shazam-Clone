<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FFTea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <header class="site-header">
    <span class="logo">FFTea</span>
    <span class="byline">created&nbsp;by&nbsp;LauritzCode</span>
  </header>

  <main class="main">
    <button id="listen-button" class="listen-button" type="button">
      <span class="ring ring-1" aria-hidden="true"></span>
      <span class="ring ring-2" aria-hidden="true"></span>
      <span class="label">Listen</span>
    </button>
    <p class="hint">Hold it up to some music</p>
  </main>

  <footer class="site-footer">
    <p class="disclaimer">Still an early prototype, the song database is tiny, so don't expect it to recognize much yet.</p>
    <a href="https://github.com/LauritzCode/FFTea---A-Shazam-Clone" target="_blank" rel="noopener noreferrer">
      view source →
    </a>
  </footer>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <span class="modal-ring modal-ring-1" aria-hidden="true"></span>
    <span class="modal-ring modal-ring-2" aria-hidden="true"></span>
    <span class="modal-ring modal-ring-3" aria-hidden="true"></span>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <p class="modal-eyebrow" id="modal-eyebrow">Found it</p>
      <h2 class="modal-title" id="modal-title">Song title</h2>
      <button class="modal-close" id="modal-close" type="button">Nice, try another</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
